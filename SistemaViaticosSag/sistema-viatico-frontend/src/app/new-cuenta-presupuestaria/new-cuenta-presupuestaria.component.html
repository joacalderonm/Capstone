<h2 mat-dialog-title>{{ tituloFormulario }}</h2>

<mat-dialog-content>
  <app-loading></app-loading>
  <form [formGroup]="cuentaForm" (ngSubmit)="guardarCuenta()" class="user-form">

    <!-- Campo Código -->
    <div class="form-field">
      <label for="codigo" class="form-label">Código</label>
      <input id="codigo" type="text" pInputText formControlName="codigo_presupuestaria" class="w-full" required />
      <small class="p-error" *ngIf="cuentaForm.get('codigo_presupuestaria')?.touched && cuentaForm.get('codigo_presupuestaria')?.invalid">
        {{ getFieldError('codigo_presupuestaria') }}
      </small>
    </div>

    <!-- Campo Nombre -->
    <div class="form-field">
      <label for="nombre" class="form-label">Nombre</label>
      <input id="nombre" type="text" pInputText formControlName="nombre_presupuestaria" class="w-full" required />
      <small class="p-error" *ngIf="cuentaForm.get('nombre_presupuestaria')?.touched && cuentaForm.get('nombre_presupuestaria')?.invalid">
        {{ getFieldError('nombre_presupuestaria') }}
      </small>
    </div>

    <!-- Campo Estado -->
    <div class="form-field">
      <label for="activo" class="form-label">Estado</label>
      <p-select
        id="activo"
        [options]="estadoOptions"
        formControlName="activo"
        placeholder="Seleccione estado"
        styleClass="w-full"
      ></p-select>
      <small class="p-error" *ngIf="cuentaForm.get('activo')?.touched && cuentaForm.get('activo')?.invalid">
        {{ getFieldError('activo') }}
      </small>
    </div>

    <div class="flex justify-content-end gap-2 mt-4">
      <p-button label="Cancelar" [text]="true" (onClick)="dialogRef.close()"></p-button>
      <p-button label="Crear cuenta" type="submit" [disabled]="cuentaForm.invalid"></p-button>
    </div>
  </form>
</mat-dialog-content>
